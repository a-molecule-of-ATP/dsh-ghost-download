<svg width="1280" height="580" viewBox="0 0 1280 580" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a99" />
    </marker>
  </defs>

  <text x="360" y="48" text-anchor="middle" font-size="17" fill="#8b93a7">default · returns at once</text>
  <text x="920" y="48" text-anchor="middle" font-size="17" fill="#8b93a7">waitSeconds &gt; 0 · blocks</text>

  <!-- shared entry -->
  <rect x="440" y="72" width="400" height="64" rx="14" fill="#1e2230" stroke="#2e3546" stroke-width="2" />
  <text x="640" y="110" text-anchor="middle" font-size="16" fill="#dfe4ee">ghost_download( urls )</text>

  <path d="M 540 136 L 540 168 L 360 168 L 360 194" stroke="#6b7a99" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M 740 136 L 740 168 L 920 168 L 920 194" stroke="#6b7a99" stroke-width="2.5" fill="none" marker-end="url(#a)" />

  <!-- left: background watch -->
  <rect x="180" y="200" width="360" height="60" rx="14" fill="#1e2230" stroke="#2e3546" stroke-width="2" />
  <text x="360" y="237" text-anchor="middle" font-size="16" fill="#dfe4ee">task ids returned</text>

  <line x1="360" y1="260" x2="360" y2="288" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />

  <rect x="180" y="294" width="360" height="64" rx="14" fill="#1b2437" stroke="#2f4a6d" stroke-width="2" />
  <text x="360" y="332" text-anchor="middle" font-size="15" fill="#a9c2e6">watch · every pollIntervalMs</text>

  <path d="M 540 326 L 572 326 L 572 300 L 556 300" stroke="#4a5b7a" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#a)" />
  <text x="588" y="336" font-size="12" fill="#6b7a99">loop</text>

  <line x1="360" y1="358" x2="360" y2="386" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />

  <rect x="210" y="392" width="300" height="54" rx="27" fill="#17301f" stroke="#4cc38a" stroke-width="2" />
  <text x="360" y="426" text-anchor="middle" font-size="15" fill="#7fdba8">completed / failed</text>

  <line x1="360" y1="446" x2="360" y2="474" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />

  <rect x="180" y="480" width="360" height="56" rx="28" fill="#1b2437" stroke="#2f4a6d" stroke-width="2" />
  <text x="360" y="514" text-anchor="middle" font-size="15" fill="#a9c2e6">notify → this session</text>

  <!-- right: synchronous wait -->
  <rect x="740" y="200" width="360" height="60" rx="14" fill="#1e2230" stroke="#2e3546" stroke-width="2" />
  <text x="920" y="237" text-anchor="middle" font-size="16" fill="#dfe4ee">the call stays open</text>

  <line x1="920" y1="260" x2="920" y2="288" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />

  <rect x="740" y="294" width="360" height="64" rx="14" fill="#1e2230" stroke="#2e3546" stroke-width="2" />
  <text x="920" y="332" text-anchor="middle" font-size="15" fill="#dfe4ee">waits up to waitSeconds</text>

  <line x1="920" y1="358" x2="920" y2="386" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />

  <rect x="770" y="392" width="300" height="54" rx="27" fill="#17301f" stroke="#4cc38a" stroke-width="2" />
  <text x="920" y="426" text-anchor="middle" font-size="15" fill="#7fdba8">final state returned</text>

  <text x="920" y="486" text-anchor="middle" font-size="13" fill="#6b7a99">no background watch needed</text>
  <text x="920" y="508" text-anchor="middle" font-size="13" fill="#6b7a99">use it when the next step needs the file</text>
</svg>
